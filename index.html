<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신제품 판매 추이 · DTC</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{--black:#111111;--white:#ffffff;--yellow:#FFA300;--gray-700:#3d3d3d;--gray-500:#8a8a8a;--gray-300:#d4d4d4;--gray-100:#f2f2f2;--line:#e6e6e6;--ok:#2e7d32;--err:#c62828;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--white);color:var(--black);line-height:1.5;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px 80px;}
  header{display:flex;align-items:flex-end;justify-content:space-between;padding:40px 0 22px;border-bottom:3px solid var(--black);flex-wrap:wrap;gap:16px;}
  .brand{display:flex;flex-direction:column;gap:6px;}
  .brand .kicker{font-size:11px;letter-spacing:.28em;font-weight:700;text-transform:uppercase;color:var(--gray-500);}
  .brand h1{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1;}
  .brand h1 .accent{color:var(--yellow);}
  .brand .prod{font-size:13px;color:var(--gray-700);margin-top:2px;font-weight:600;}
  .header-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .updated{font-size:12px;color:var(--gray-500);font-variant-numeric:tabular-nums;}
  .status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle;}
  .status-live{background:var(--yellow);}
  /* Upload toggle */
  .up-toggle{margin-top:20px;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--gray-100);border-radius:4px;cursor:pointer;user-select:none;}
  .up-toggle:hover{background:#eaeaea;}
  .up-toggle-label{font-size:13px;font-weight:700;color:var(--black);}
  .up-toggle-hint{font-size:12px;color:var(--gray-500);}
  .up-adv{margin-top:16px;border-top:1px solid var(--line);padding-top:12px;}
  .up-adv summary{font-size:12px;font-weight:600;color:var(--gray-500);cursor:pointer;}
  .up-adv summary:hover{color:var(--black);}
  /* Upload zone */
  .uploader{margin-top:20px;border:1.5px dashed var(--gray-300);border-radius:4px;padding:20px;background:var(--gray-100);transition:all .15s;}
  .uploader.drag{border-color:var(--yellow);background:#FFF8EC;}
  .up-row{display:flex;gap:20px;align-items:center;flex-wrap:wrap;}
  .up-slot{flex:1;min-width:220px;display:flex;flex-direction:column;gap:6px;}
  .up-slot .lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--gray-500);}
  .up-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;background:var(--white);border:1px solid var(--gray-300);border-radius:3px;font-size:13px;font-weight:600;cursor:pointer;color:var(--gray-700);}
  .up-btn:hover{border-color:var(--black);}
  .up-state{font-size:12px;font-weight:600;}
  .up-state.ok{color:var(--ok);} .up-state.wait{color:var(--gray-500);} .up-state.err{color:var(--err);}
  .up-actions{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap;}
  .btn-run{padding:10px 22px;background:var(--black);color:var(--white);border:none;border-radius:3px;font-size:13px;font-weight:700;cursor:pointer;}
  .btn-run:hover{background:var(--yellow);color:var(--black);}
  .btn-run:disabled{opacity:.4;cursor:not-allowed;}
  .btn-ghost{padding:10px 16px;background:transparent;border:1px solid var(--gray-300);border-radius:3px;font-size:13px;font-weight:600;cursor:pointer;color:var(--gray-700);}
  .btn-ghost:hover{border-color:var(--black);}
  .up-hint{font-size:11px;color:var(--gray-500);width:100%;margin-top:10px;}
  .up-msg{font-size:12.5px;font-weight:600;margin-top:10px;}
  .up-msg.ok{color:var(--ok);} .up-msg.err{color:var(--err);}
  .filters{display:flex;gap:8px;margin:24px 0 6px;flex-wrap:wrap;align-items:center;}
  .filters .flabel{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gray-500);margin-right:4px;}
  .filters .divider{width:1px;height:22px;background:var(--line);margin:0 8px;}
  .chip{padding:7px 15px;border:1px solid var(--gray-300);background:var(--white);border-radius:100px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--gray-700);transition:all .12s;}
  .chip:hover{border-color:var(--black);}
  .chip.active{background:var(--black);color:var(--white);border-color:var(--black);}
  .chip.series.active{background:var(--yellow);color:var(--black);border-color:var(--yellow);}
  .chip.brand-chip.active{background:var(--black);color:var(--white);border-color:var(--black);}
  /* Series multi-select */
  .series-select{position:relative;}
  .ss-btn{display:inline-flex;align-items:center;gap:10px;padding:7px 14px;border:1px solid var(--gray-300);background:var(--white);border-radius:100px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--black);font-family:inherit;}
  .ss-btn:hover{border-color:var(--black);}
  .ss-caret{color:var(--gray-500);font-size:10px;}
  .ss-panel{position:absolute;top:calc(100% + 6px);left:0;z-index:50;width:280px;background:var(--white);border:1px solid var(--gray-300);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.12);padding:10px;}
  .ss-tools{display:flex;gap:6px;margin-bottom:8px;}
  .ss-tools input{flex:1;min-width:0;padding:7px 10px;border:1px solid var(--gray-300);border-radius:4px;font-size:12px;font-family:inherit;}
  .ss-tools input:focus{outline:2px solid var(--yellow);border-color:var(--yellow);}
  .ss-mini{padding:6px 10px;border:1px solid var(--gray-300);background:var(--white);border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--gray-700);}
  .ss-mini:hover{border-color:var(--black);}
  .ss-list{max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;}
  .ss-item{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:4px;font-size:12.5px;cursor:pointer;user-select:none;}
  .ss-item:hover{background:var(--gray-100);}
  .ss-item .ss-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .ss-item .ss-check{margin-left:auto;color:var(--yellow);font-weight:800;visibility:hidden;}
  .ss-item.on .ss-check{visibility:visible;}
  .ss-item .ss-mon{font-size:10px;color:var(--gray-500);margin-left:4px;}
  .rank-sort{display:flex;align-items:center;gap:8px;}
  .rank-sort-label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gray-500);}
  .chip.rk{padding:6px 13px;font-size:12px;}
  .chip.rk.active{background:var(--yellow);color:var(--black);border-color:var(--yellow);}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);margin:24px 0;border:1px solid var(--line);}
  .kpi{background:var(--white);padding:22px 20px;}
  .kpi .k-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-500);font-weight:700;margin-bottom:10px;}
  .kpi .k-value{font-size:28px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1;}
  .kpi .k-value .unit{font-size:13px;font-weight:600;color:var(--gray-500);margin-left:3px;}
  .kpi .k-sub{font-size:12px;color:var(--gray-500);margin-top:8px;font-variant-numeric:tabular-nums;}
  .kpi.accent{border-top:3px solid var(--yellow);}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px;}
  .card{border:1px solid var(--line);border-radius:2px;padding:22px;}
  .card.full{grid-column:1 / -1;}
  .card h2{font-size:15px;font-weight:800;letter-spacing:-.01em;margin-bottom:2px;}
  .card .csub{font-size:12px;color:var(--gray-500);margin-bottom:18px;}
  .chart-box{position:relative;height:300px;}
  .chart-box.tall{height:340px;}
  .series-toggles{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .stog{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border:1px solid var(--gray-300);border-radius:100px;font-size:12px;font-weight:600;cursor:pointer;user-select:none;transition:all .12s;color:var(--gray-500);}
  .stog .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .stog.on{color:var(--black);border-color:var(--black);}
  .stog.off{opacity:.45;text-decoration:line-through;}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
  thead th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-500);text-align:right;padding:0 0 12px;font-weight:700;border-bottom:1px solid var(--line);}
  thead th:first-child,thead th:nth-child(2){text-align:left;}
  tbody td{padding:12px 0;border-bottom:1px solid var(--gray-100);text-align:right;font-size:13.5px;}
  tbody td:first-child,tbody td:nth-child(2){text-align:left;}
  tbody tr:last-child td{border-bottom:none;}
  .rank-num{display:inline-block;width:22px;color:var(--gray-500);font-weight:800;font-size:12px;}
  .rank-num.top{color:var(--yellow);}
  .bar-cell{width:100px;}
  .bar-track{height:6px;background:var(--gray-100);border-radius:100px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--yellow);border-radius:100px;}
  .swatch{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px;vertical-align:middle;border:1px solid var(--line);}
  footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);font-size:11px;color:var(--gray-500);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
  @media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr);}.grid{grid-template-columns:1fr;}.brand h1{font-size:24px;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="kicker">DTC · NEW PRODUCT TRACKER</span>
      <h1>신제품 판매 <span class="accent">추이</span></h1>
    </div>
    <div class="header-right">
      <span class="updated" id="dataStatus"><span class="status-dot status-live"></span>데이터 기간</span>
      <span class="updated" id="lastUpdate">—</span>
    </div>
  </header>


  <div class="filters">
    <span class="flabel">브랜드</span>
    <div id="brandChips" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
    <div class="divider"></div>
    <span class="flabel">발매월</span>
    <div id="monthChips" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
  </div>
  <div class="filters" style="margin-top:4px;">
    <span class="flabel">시리즈</span>
    <div class="series-select" id="seriesSelect">
      <button class="ss-btn" id="ssBtn" type="button"><span id="ssLabel">전체 시리즈</span><span class="ss-caret">▾</span></button>
      <div class="ss-panel" id="ssPanel" style="display:none;">
        <div class="ss-tools">
          <input type="text" id="ssSearch" placeholder="시리즈 검색…">
          <button class="ss-mini" id="ssAll">전체</button>
          <button class="ss-mini" id="ssNone">해제</button>
        </div>
        <div class="ss-list" id="ssList"></div>
      </div>
    </div>
  </div>
  <div class="filters" style="margin-top:4px;">
    <span class="flabel">채널</span>
    <div class="chip ch active" data-ch="all">전체</div>
    <div class="chip ch" data-ch="네이버">네이버</div>
    <div class="chip ch" data-ch="자사몰">자사몰</div>
    <div class="chip ch" data-ch="29cm">29CM</div>
    <div class="chip ch" data-ch="무신사">무신사</div>
    <div class="divider"></div>
    <span class="flabel">보기</span>
    <div class="chip metric active" data-m="rev">매출</div>
    <div class="chip metric" data-m="qty">판매량</div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="grid">
    <div class="card full">
      <h2>발매 후 누적 판매 <span style="font-weight:600;color:var(--gray-500);font-size:12px;">시리즈별 · D+N</span></h2>
      <div style="margin:2px 0 14px;">
        <div class="series-select" id="cumSeries">
          <button class="ss-btn" id="cumBtn" type="button"><span id="cumLabel">전체 시리즈</span><span class="ss-caret">▾</span></button>
          <div class="ss-panel" id="cumPanel" style="display:none;">
            <div class="ss-tools">
              <input type="text" id="cumSearch" placeholder="시리즈 검색…">
              <button class="ss-mini" id="cumAll">전체</button>
              <button class="ss-mini" id="cumNone">해제</button>
            </div>
            <div class="ss-list" id="cumList"></div>
          </div>
        </div>
      </div>
      <div class="chart-box tall"><canvas id="cumChart"></canvas></div>
    </div>
    <div class="card">
      <div class="card-head">
        <h2>컬러별 성과</h2>
        <div class="series-select" id="colorSeriesSelect">
          <button class="ss-btn" id="csBtn" type="button" style="padding:5px 12px;font-size:11.5px;"><span id="csLabel">전체 시리즈</span><span class="ss-caret">▾</span></button>
          <div class="ss-panel" id="csPanel" style="display:none;right:0;left:auto;">
            <div class="ss-tools"><input type="text" id="csSearch" placeholder="시리즈 검색…"><button class="ss-mini" id="csAll">전체</button><button class="ss-mini" id="csNone">해제</button></div>
            <div class="ss-list" id="csList"></div>
          </div>
        </div>
      </div>
      <div class="chart-box"><canvas id="colorChart"></canvas></div>
    </div>
    <div class="card">
      <h2>채널 비중</h2>
      <div class="chart-box"><canvas id="channelChart"></canvas></div>
    </div>
    <div class="card full">
      <div class="card-head">
        <div><h2>상품 × 컬러 판매 순위</h2></div>
        <div class="rank-sort">
          <span class="rank-sort-label">정렬</span>
          <div class="chip rk active" data-rk="rev">매출순</div>
          <div class="chip rk" data-rk="qty">판매량순</div>
        </div>
      </div>
      <table id="rankTable"><thead><tr><th>상품</th><th>컬러</th><th>판매량</th><th>매출</th><th class="bar-cell">비중</th></tr></thead><tbody></tbody></table>
    </div>

    <div class="card full">
      <div class="card-head">
        <div><h2>상품별 반품 순위</h2></div>
        <div class="rank-sort">
          <span class="rank-sort-label">정렬</span>
          <div class="chip rf active" data-rf="cnt">건수순</div>
          <div class="chip rf" data-rf="rate">반품률순</div>
        </div>
      </div>
      <table id="refundTable"><thead><tr><th>상품</th><th>시리즈</th><th>반품건수</th><th>반품률</th><th class="bar-cell">비중</th></tr></thead><tbody></tbody></table>
    </div>
  </div>

  <footer>
    <span>RCC Co. Ltd. — 보기 전용 대시보드</span>
    <span id="rowCount">—</span>
  </footer>
</div>

const wonShort=n=>n>=100000000?(n/100000000).toFixed(1)+'억':n>=10000?Math.round(n/10000)+'만':won(n);
const val=r=>metric==='rev'?r.rev:r.qty;
const fmtMetric=v=>metric==='rev'?wonShort(v)+'원':won(v)+'개';
const ddayOf=r=>Math.round((new Date(r.date)-new Date(r.launch))/86400000);
const toNum=v=>+String(v==null?'':v).replace(/[^0-9.-]/g,'')||0;
const ymd=v=>{if(v==null||v==='')return'';const d=new Date(v);if(!isNaN(d))return d.toISOString().slice(0,10);const m=String(v).match(/\d{4}-\d{2}-\d{2}/);return m?m[0]:String(v).slice(0,10);};


// 시리즈 드롭다운 열고 닫기
const ssPanel=document.getElementById('ssPanel'),ssBtn=document.getElementById('ssBtn');
ssBtn.addEventListener('click',e=>{e.stopPropagation();const open=ssPanel.style.display!=='none';ssPanel.style.display=open?'none':'block';if(!open){buildSeriesSelect();document.getElementById('ssSearch').focus();}});
document.addEventListener('click',e=>{if(!document.getElementById('seriesSelect').contains(e.target))ssPanel.style.display='none';});
document.getElementById('ssSearch').addEventListener('input',buildSeriesSelect);
document.getElementById('ssAll').addEventListener('click',()=>{selectedSeries=null;seriesOn={};colorSeries=null;buildSeriesSelect();renderAll();});
document.getElementById('ssNone').addEventListener('click',()=>{selectedSeries=new Set();seriesOn={};colorSeries=null;buildSeriesSelect();renderAll();});

// 컬러 카드 시리즈 드롭다운
const csPanel=document.getElementById('csPanel'),csBtn=document.getElementById('csBtn');
csBtn.addEventListener('click',e=>{e.stopPropagation();const open=csPanel.style.display!=='none';csPanel.style.display=open?'none':'block';if(!open){buildColorSeriesSelect();document.getElementById('csSearch').focus();}});
document.addEventListener('click',e=>{if(!document.getElementById('colorSeriesSelect').contains(e.target))csPanel.style.display='none';});
document.getElementById('csSearch').addEventListener('input',buildColorSeriesSelect);
document.getElementById('csAll').addEventListener('click',()=>{colorSeries=null;buildColorSeriesSelect();renderColor(scoped());});
document.getElementById('csNone').addEventListener('click',()=>{colorSeries=new Set();buildColorSeriesSelect();renderColor(scoped());});

const cumPanel=document.getElementById('cumPanel'),cumBtn=document.getElementById('cumBtn');
cumBtn.addEventListener('click',e=>{e.stopPropagation();const open=cumPanel.style.display!=='none';cumPanel.style.display=open?'none':'block';if(!open){buildCumSelect();document.getElementById('cumSearch').focus();}});
document.addEventListener('click',e=>{if(!document.getElementById('cumSeries').contains(e.target))cumPanel.style.display='none';});
document.getElementById('cumSearch').addEventListener('input',buildCumSelect);
document.getElementById('cumAll').addEventListener('click',()=>{[...new Set(cumRows.map(d=>d.series))].filter(Boolean).forEach(s=>seriesOn[s]=true);buildCumSelect();renderCumulative(cumRows);});
document.getElementById('cumNone').addEventListener('click',()=>{[...new Set(cumRows.map(d=>d.series))].filter(Boolean).forEach(s=>seriesOn[s]=false);buildCumSelect();renderCumulative(cumRows);});


// ================= 차트 =================
function assignSeriesColors(){const all=[...new Set(RAW.map(d=>d.series))].filter(Boolean);all.forEach((s,i)=>{if(!seriesColor[s])seriesColor[s]=SERIES_PALETTE[i%SERIES_PALETTE.length];if(seriesOn[s]===undefined)seriesOn[s]=true;});}
function scoped(){let r=RAW;if(activeBrand!=='all')r=r.filter(d=>d.brand===activeBrand);if(activeMonth!=='all')r=r.filter(d=>d.month===activeMonth);if(selectedSeries)r=r.filter(d=>selectedSeries.has(d.series));if(activeCh!=='all')r=r.filter(d=>d.channel===activeCh);return r;}
function poolForScope(){let r=RAW;if(activeBrand!=='all')r=r.filter(d=>d.brand===activeBrand);if(activeMonth!=='all')r=r.filter(d=>d.month===activeMonth);return r;}
function buildBrandChips(){const brands=['all',...[...new Set(RAW.map(d=>d.brand))].filter(Boolean).sort()];document.getElementById('brandChips').innerHTML=brands.map(b=>`<div class="chip brand-chip ${b===activeBrand?'active':''}" data-b="${b}">${b==='all'?'전체':b}</div>`).join('');document.querySelectorAll('.brand-chip').forEach(c=>c.addEventListener('click',()=>{activeBrand=c.dataset.b;activeMonth='all';selectedSeries=null;colorSeries=null;seriesOn={};buildBrandChips();buildMonthChips();buildSeriesSelect();renderAll();}));}
function buildMonthChips(){let pool=RAW;if(activeBrand!=='all')pool=pool.filter(d=>d.brand===activeBrand);const months=['all',...[...new Set(pool.map(d=>d.month))].filter(Boolean).sort()];document.getElementById('monthChips').innerHTML=months.map(m=>`<div class="chip month-chip ${m===activeMonth?'active':''}" data-m="${m}">${m==='all'?'전체':m}</div>`).join('');document.querySelectorAll('.month-chip').forEach(c=>c.addEventListener('click',()=>{activeMonth=c.dataset.m;selectedSeries=null;colorSeries=null;seriesOn={};buildMonthChips();buildSeriesSelect();renderAll();}));}
function seriesInScope(){const pool=poolForScope();return [...new Set(pool.map(d=>d.series))].filter(Boolean);}
function updateSeriesLabel(){const all=seriesInScope();let txt;if(!selectedSeries||selectedSeries.size===all.length)txt='전체 시리즈';else if(selectedSeries.size===0)txt='선택 없음';else if(selectedSeries.size===1)txt=[...selectedSeries][0];else txt=selectedSeries.size+'개 시리즈 선택';document.getElementById('ssLabel').textContent=txt;}
function buildSeriesSelect(){const all=seriesInScope();if(selectedSeries===null){selectedSeries=new Set(all);}else{selectedSeries=new Set([...selectedSeries].filter(s=>all.includes(s)));}const q=(document.getElementById('ssSearch').value||'').trim().toLowerCase();const monthOf={};poolForScope().forEach(d=>{if(!monthOf[d.series])monthOf[d.series]=d.month;});const shown=all.filter(s=>!q||s.toLowerCase().includes(q));document.getElementById('ssList').innerHTML=shown.map(s=>{const on=!selectedSeries||selectedSeries.has(s);return `<div class="ss-item ${on?'on':''}" data-s="${s.replace(/"/g,'&quot;')}"><span class="ss-dot" style="background:${seriesColor[s]||'#8a8a8a'}"></span>${s}<span class="ss-mon">${monthOf[s]||''}</span><span class="ss-check">✓</span></div>`;}).join('')||'<div style="padding:10px;color:#8a8a8a;font-size:12px;">검색 결과 없음</div>';document.querySelectorAll('#ssList .ss-item').forEach(it=>it.addEventListener('click',()=>{const s=it.dataset.s;const isAll=!selectedSeries||selectedSeries.size===all.length;if(isAll){selectedSeries=new Set([s]);}else if(selectedSeries.has(s)){selectedSeries.delete(s);if(selectedSeries.size===0)selectedSeries=new Set(all);}else{selectedSeries.add(s);}seriesOn={};colorSeries=null;buildSeriesSelect();renderAll();}));updateSeriesLabel();}
function updateColorLabel(){const all=[...new Set(scoped().filter(d=>d.status==='판매').map(d=>d.series))].filter(Boolean);const lab=document.getElementById('csLabel');if(!colorSeries||colorSeries.size===all.length)lab.textContent='전체 시리즈';else if(colorSeries.size===0)lab.textContent='선택 없음';else if(colorSeries.size===1)lab.textContent=[...colorSeries][0];else lab.textContent=colorSeries.size+'개 선택';}
function buildColorSeriesSelect(){
  const all=[...new Set(scoped().map(d=>d.series))].filter(Boolean);
  if(colorSeries===null){colorSeries=new Set(all);}else{colorSeries=new Set([...colorSeries].filter(s=>all.includes(s)));}
  const q=(document.getElementById('csSearch').value||'').trim().toLowerCase();
  const shown=all.filter(s=>!q||s.toLowerCase().includes(q));
  const lab=document.getElementById('csLabel');
  if(!colorSeries||colorSeries.size===all.length)lab.textContent='전체 시리즈';
  else if(colorSeries.size===0)lab.textContent='선택 없음';
  else if(colorSeries.size===1)lab.textContent=[...colorSeries][0];
  else lab.textContent=colorSeries.size+'개 선택';
  document.getElementById('csList').innerHTML=shown.map(s=>{const on=!colorSeries||colorSeries.has(s);return `<div class="ss-item ${on?'on':''}" data-s="${s.replace(/"/g,'&quot;')}"><span class="ss-dot" style="background:${seriesColor[s]||'#8a8a8a'}"></span>${s}<span class="ss-check">✓</span></div>`;}).join('')||'<div style="padding:10px;color:#8a8a8a;font-size:12px;">검색 결과 없음</div>';
  document.querySelectorAll('#csList .ss-item').forEach(it=>it.addEventListener('click',()=>{const s=it.dataset.s;if(!colorSeries)colorSeries=new Set(all);if(colorSeries.has(s))colorSeries.delete(s);else colorSeries.add(s);it.classList.toggle('on',colorSeries.has(s));updateColorLabel();renderColor(scoped().filter(d=>d.status==='판매'));}));
}
function buildSeriesToggles(rows){const list=[...new Set(rows.map(d=>d.series))].filter(Boolean);document.getElementById('seriesToggles').innerHTML=list.map(s=>`<span class="stog ${seriesOn[s]!==false?'on':'off'}" data-s="${s}"><span class="dot" style="background:${seriesColor[s]}"></span>${s}</span>`).join('');document.querySelectorAll('.stog').forEach(t=>t.addEventListener('click',()=>{const s=t.dataset.s;seriesOn[s]=seriesOn[s]===false;buildSeriesToggles(rows);renderCumulative(rows);}));}

function buildCumSelect(){
  const list=[...new Set(cumRows.map(d=>d.series))].filter(Boolean);
  list.forEach(s=>{if(seriesOn[s]===undefined)seriesOn[s]=true;});
  const q=(document.getElementById('cumSearch').value||'').trim().toLowerCase();
  const shown=list.filter(s=>!q||s.toLowerCase().includes(q));
  const relabel=()=>{const oc=list.filter(x=>seriesOn[x]!==false).length;document.getElementById('cumLabel').textContent=list.length===0?'시리즈 없음':oc===0?'선택 없음':oc===list.length?'전체 시리즈':oc+'개 시리즈';};
  relabel();
  document.getElementById('cumList').innerHTML=shown.map(s=>{const on=seriesOn[s]!==false;return `<div class="ss-item ${on?'on':''}" data-s="${s.replace(/"/g,'&quot;')}"><span class="ss-dot" style="background:${seriesColor[s]||'#8a8a8a'}"></span>${s}<span class="ss-check">✓</span></div>`;}).join('')||'<div style="padding:10px;color:#8a8a8a;font-size:12px;">시리즈 없음</div>';
  document.querySelectorAll('#cumList .ss-item').forEach(it=>it.addEventListener('click',()=>{const s=it.dataset.s;seriesOn[s]=seriesOn[s]===false;it.classList.toggle('on',seriesOn[s]!==false);relabel();renderCumulative(cumRows);}));
}
function renderKPIs(rows){const rev=rows.reduce((s,d)=>s+d.rev,0),qty=rows.reduce((s,d)=>s+d.qty,0);const cAgg={};rows.forEach(d=>{const k=d.color+'||'+d.series;cAgg[k]=(cAgg[k]||0)+val(d);});const bestEntry=Object.entries(cAgg).sort((a,b)=>b[1]-a[1])[0];let bestColor='—',bestSeries='',bestVal=0;if(bestEntry){const parts=bestEntry[0].split('||');bestColor=parts[0];bestSeries=parts[1]||'';bestVal=bestEntry[1];}const maxD=Math.max(0,...rows.map(ddayOf));const nSeries=new Set(rows.map(d=>d.series)).size;document.getElementById('kpis').innerHTML=`<div class="kpi accent"><div class="k-label">누적 매출</div><div class="k-value">${wonShort(rev)}<span class="unit">원</span></div><div class="k-sub">판매 ${won(qty)}개 · 시리즈 ${nSeries}개</div></div><div class="kpi"><div class="k-label">객단가</div><div class="k-value">${wonShort(qty?rev/qty:0)}<span class="unit">원</span></div><div class="k-sub">매출 ÷ 판매량</div></div><div class="kpi"><div class="k-label">최다 판매 컬러</div><div class="k-value" style="font-size:20px;">${bestColor}</div><div class="k-sub">${bestSeries?bestSeries+' · ':''}${bestEntry?fmtMetric(bestVal):''}</div></div><div class="kpi"><div class="k-label">발매 경과</div><div class="k-value">D+${maxD}</div><div class="k-sub">${Math.floor(maxD/7)}주차 진입</div></div>`;}
function renderCumulative(rows){charts.cum&&charts.cum.destroy();const seriesList=[...new Set(rows.map(d=>d.series))].filter(Boolean).filter(s=>seriesOn[s]!==false);const maxD=Math.max(0,...rows.map(ddayOf));const labels=[];for(let i=0;i<=maxD;i++)labels.push('D+'+i);const datasets=seriesList.map(s=>{const clr=seriesColor[s]||'#8a8a8a';const daily=labels.map((_,i)=>rows.filter(d=>d.series===s&&ddayOf(d)===i).reduce((a,d)=>a+d.qty,0));let run=0;const cum=daily.map(v=>run+=v);return{label:s,data:cum,borderColor:clr,backgroundColor:clr,pointRadius:2,pointHoverRadius:4,borderWidth:2.5,tension:.25,fill:false};});charts.cum=new Chart(document.getElementById('cumChart'),{type:'line',data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{callbacks:{title:items=>'발매 후 '+items[0].label,label:c=>c.dataset.label+': 누적 '+won(c.parsed.y)+'개'}}},scales:{x:{grid:{display:false},ticks:{font:{size:10}},title:{display:true,text:'발매 후 경과일',font:{size:11},color:'#8a8a8a'}},y:{beginAtZero:true,grid:{color:'#f0f0f0'},ticks:{font:{size:11},precision:0,callback:v=>won(v)+'개'}}}}});}
function renderColor(rows){charts.color&&charts.color.destroy();let cr=rows;if(colorSeries)cr=rows.filter(d=>colorSeries.has(d.series));const agg={};cr.forEach(d=>agg[d.color]=(agg[d.color]||0)+val(d));const arr=Object.entries(agg).sort((a,b)=>b[1]-a[1]);charts.color=new Chart(document.getElementById('colorChart'),{type:'bar',data:{labels:arr.map(a=>a[0]),datasets:[{data:arr.map(a=>a[1]),backgroundColor:arr.map(a=>colorHex(a[0])),borderRadius:2,barPercentage:.7}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmtMetric(c.parsed.x)}}},scales:{x:{grid:{color:'#f0f0f0'},ticks:{font:{size:11},callback:v=>metric==='rev'?wonShort(v):won(v)}},y:{grid:{display:false},ticks:{font:{size:11,weight:'600'}}}}}});}
function renderChannel(rows){charts.channel&&charts.channel.destroy();const agg={};rows.forEach(d=>agg[d.channel]=(agg[d.channel]||0)+val(d));const labels=Object.keys(agg);charts.channel=new Chart(document.getElementById('channelChart'),{type:'doughnut',data:{labels,datasets:[{data:labels.map(k=>agg[k]),backgroundColor:labels.map(k=>CH[k]||'#8a8a8a'),borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom',labels:{boxWidth:10,boxHeight:10,font:{size:12},padding:14}},tooltip:{callbacks:{label:c=>{const t=c.dataset.data.reduce((a,b)=>a+b,0);return c.label+': '+fmtMetric(c.parsed)+' ('+(c.parsed/t*100).toFixed(1)+'%)';}}}}}});}
function renderRank(rows){const agg={};rows.forEach(d=>{const k=d.product+'||'+d.color;if(!agg[k])agg[k]={product:d.product,color:d.color,qty:0,rev:0};agg[k].qty+=d.qty;agg[k].rev+=d.rev;});const rv=r=>rankSort==='rev'?r.rev:r.qty;const arr=Object.values(agg).sort((a,b)=>rv(b)-rv(a));const max=arr.length?rv(arr[0]):1;document.querySelector('#rankTable tbody').innerHTML=arr.map((r,i)=>`<tr><td><span class="rank-num ${i===0?'top':''}">${String(i+1).padStart(2,'0')}</span>${r.product}</td><td><span class="swatch" style="background:${colorHex(r.color)}"></span>${r.color}</td><td>${won(r.qty)}개</td><td>${won(r.rev)}원</td><td class="bar-cell"><div class="bar-track"><div class="bar-fill" style="width:${(rv(r)/max*100).toFixed(0)}%"></div></div></td></tr>`).join('');}
function renderAll(){const all=scoped();const rows=all.filter(d=>d.status==='판매');const refunds=all.filter(d=>d.status==='환불');renderKPIs(rows);cumRows=rows;buildCumSelect();renderCumulative(rows);buildColorSeriesSelect();renderColor(rows);renderChannel(rows);renderRank(rows);renderRefundRank(refunds,rows);const dates=[...new Set(RAW.map(d=>d.date))].sort();document.getElementById('lastUpdate').textContent=dates.length?dates[0]+' ~ '+dates[dates.length-1]:'—';document.getElementById('rowCount').textContent=RAW.length+'개 행';}
// 반품 순위 (건수/반품률). saleRows로 반품률 분모 계산
function renderRefundRank(refunds,saleRows){
  // 상품(7자리) 단위 집계. 반품률 = 반품건수 / (반품건수 + 판매건수)
  const agg={};
  refunds.forEach(d=>{const k=d.prod7||d.product;if(!agg[k])agg[k]={product:d.product,series:d.series,cnt:0,amt:0};agg[k].cnt+=1;agg[k].amt+=(d.refund||d.rev||0);});
  const saleCnt={};saleRows.forEach(d=>{const k=d.prod7||(d.barcode?d.barcode.slice(0,7):d.product);saleCnt[k]=(saleCnt[k]||0)+1;});
  const arr=Object.entries(agg).map(([k,v])=>{const sc=saleCnt[k]||0;return{...v,rate:(v.cnt/(v.cnt+sc)*100)};});
  const rv=r=>refundSort==='rate'?r.rate:r.cnt;
  arr.sort((a,b)=>rv(b)-rv(a));
  const max=arr.length?rv(arr[0]):1;
  const body=document.querySelector('#refundTable tbody');
  if(!arr.length){body.innerHTML='<tr><td colspan="5" style="text-align:center;color:#8a8a8a;padding:20px;">반품 데이터가 없어요</td></tr>';return;}
  body.innerHTML=arr.map((r,i)=>`<tr><td><span class="rank-num ${i===0?'top':''}">${String(i+1).padStart(2,'0')}</span>${r.product}</td><td style="color:#8a8a8a;font-size:12px;">${r.series||''}</td><td>${won(r.cnt)}건</td><td>${r.rate.toFixed(1)}%</td><td class="bar-cell"><div class="bar-track"><div class="bar-fill" style="width:${(rv(r)/max*100).toFixed(0)}%;background:#c62828;"></div></div></td></tr>`).join('');
}

document.querySelectorAll('.chip.ch').forEach(c=>c.addEventListener('click',()=>{document.querySelectorAll('.chip.ch').forEach(x=>x.classList.remove('active'));c.classList.add('active');activeCh=c.dataset.ch;renderAll();}));
document.querySelectorAll('.chip.metric').forEach(c=>c.addEventListener('click',()=>{document.querySelectorAll('.chip.metric').forEach(x=>x.classList.remove('active'));c.classList.add('active');metric=c.dataset.m;renderAll();}));
document.querySelectorAll('.chip.rk').forEach(c=>c.addEventListener('click',()=>{document.querySelectorAll('.chip.rk').forEach(x=>x.classList.remove('active'));c.classList.add('active');rankSort=c.dataset.rk;renderRank(scoped().filter(d=>d.status==='판매'));}));
document.querySelectorAll('.chip.rf').forEach(c=>c.addEventListener('click',()=>{document.querySelectorAll('.chip.rf').forEach(x=>x.classList.remove('active'));c.classList.add('active');refundSort=c.dataset.rf;const all=scoped();renderRefundRank(all.filter(d=>d.status==='환불'),all.filter(d=>d.status==='판매'));}));


// ===== 구글시트 자동 읽기 (통합 탭 게시 CSV) =====
function dedupNormalized(rows){
  const seen=new Set(),out=[];
  for(const r of rows){const k=r.uid||[r.channel,r.orderno,r.barcode,r.date,r.qty,r.rev,r.status].join('|');
    if(k&&seen.has(k))continue; if(k)seen.add(k); out.push(r);}
  return out;
}
function loadFromSheet(url){
  if(!url)return;
  Papa.parse(url,{download:true,header:true,skipEmptyLines:true,
    complete:res=>{try{
      const parsed=dedupNormalized(res.data.map(normalize).filter(r=>r.date&&r.barcode));
      if(!parsed.length)return;
      RAW=parsed;activeBrand='all';activeMonth='all';activeCh='all';selectedSeries=null;seriesOn={};seriesColor={};assignSeriesColors();
      document.querySelectorAll('.chip.ch').forEach(x=>x.classList.remove('active'));
      const allc=document.querySelector('.chip.ch[data-ch="all"]');if(allc)allc.classList.add('active');
      document.getElementById('dataStatus').innerHTML='<span class="status-dot status-live"></span>구글시트 자동 연동';
      buildBrandChips();buildMonthChips();buildSeriesSelect();renderAll();
    }catch(e){console.error(e);}},
    error:err=>console.error('시트 읽기 실패',err)});
}

assignSeriesColors();buildBrandChips();buildMonthChips();buildSeriesSelect();renderAll();
if(SHEET_CSV_URL)loadFromSheet(SHEET_CSV_URL);
</script>
